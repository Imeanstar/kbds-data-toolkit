name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Synthetic tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Copy, verify and HTML report self-check
        run: python3 -B scripts/kbds.py self-check
